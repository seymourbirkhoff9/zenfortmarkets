<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel — Zenfort Markets</title>
    <link rel="stylesheet" href="/static/css/main.css" />
</head>

<body class="app-layout">
    <aside id="sidebar">
        <div class="brand">Zenfort <span class="badge">Admin</span></div>
        <nav>
            <a href="/admin">Overview</a>
            <a href="/admin/users">Users</a>
            <a href="/admin/transactions">Transactions</a>
            <a href="/admin/credit">Credit Wallet</a>
            <a href="/logout">Logout</a>
        </nav>
    </aside>

    <main id="main-content">
        <header class="page-header">
            <h1>Admin Panel</h1>
        </header>

        <!-- User management -->
        <section id="user-management">
            <h2>Users</h2>
            <table id="users-table">
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Name</th>
                        <th>Active</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-body"><!-- populated by JS --></tbody>
            </table>
        </section>

        <!-- Credit wallet form -->
        <section id="credit-section">
            <h2>Credit User Wallet</h2>
            <form id="credit-form">
                <input type="email" id="credit-email" placeholder="User email" required />
                <select id="wallet-type">
                    <option value="main">Main</option>
                    <option value="profit">Profit</option>
                </select>
                <input type="number" id="credit-amount" placeholder="Amount (USD)" step="0.01" required />
                <textarea id="credit-desc" placeholder="Description (optional)"></textarea>
                <button type="submit" class="btn-primary">Credit Wallet</button>
            </form>
        </section>
    </main>

    <script src="/static/js/admin.js"></script>
</body>

</html>
